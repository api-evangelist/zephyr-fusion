name: Zephyr Fusion
description: >-
  Zephyr Fusion is a Y Combinator (Fall 2025) company building the first in-orbit
  fusion power source: a compact, megawatt-class magnetic-confinement fusion reactor
  designed to enable large-scale industry in space at a fraction of the cost of
  equivalent solar. Founded by former Lawrence Livermore and Oak Ridge National
  Laboratory physicists, the company targets microgravity manufacturing, orbital
  data centers, defense, propulsion, and human habitation in space, exploiting the
  vacuum of space to accommodate larger plasma regions than Earth-based reactors.
  As an early-stage deep-tech hardware company, Zephyr Fusion currently publishes no
  public API, developer platform, SDK, or machine-readable specification; this
  profile captures its identity in the API Evangelist network. An enrichment pass on
  2026-07-21 confirmed no API surface exists (no api./docs./developer. hosts resolve;
  no /developers, /docs, or /.well-known discovery surface is published).
